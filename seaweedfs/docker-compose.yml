services:
  seaweedfs:
    # Pin the version you're running now (4.48) so a restart can't silently upgrade.
    image: chrislusf/seaweedfs:4.48
    container_name: seaweedfs
    restart: unless-stopped

    ports:
      - "8333:8333"              # S3 API: needs keys, apps use this
      - "127.0.0.1:9333:9333"    # Master / admin UI: this machine only (no auth)
      - "127.0.0.1:8888:8888"    # Filer: this machine only (no auth, full file access)

    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}

    volumes:
      - ./data:/data
      - /Volumes/Disk2/seaweedfs:/data2

    command: server -dir=/data -volume.max=0 -s3

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
